<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro Gateway — Debug Dashboard</title>
  <style>
    :root {
      --bg-page: #09090b;
      --bg-surface: #18181b;
      --bg-surface-hover: #27272a;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;

      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);

      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.1);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --yellow: #eab308;

      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;

      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg-page);
      color: var(--text-main);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
      /* prevent layout shift on scroll */
    }

    /* Typography */
    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 .ghost {
      font-size: 22px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.2));
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge.live {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .badge.live::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        opacity: 1;
      }
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }

    .btn:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-danger {
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: var(--red-bg);
      border-color: var(--red);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .list-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .list-title span {
      color: var(--text-main);
      background: var(--bg-surface);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 13px;
      margin-left: 8px;
    }

    /* Request List Cards */
    .request-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .request-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 24px;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-card);
    }

    .request-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 12px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
    }

    .request-card.error {
      border-left: 4px solid var(--red);
      padding-left: 16px;
    }

    .request-card.success {
      border-left: 4px solid var(--green);
      padding-left: 16px;
    }

    /* Card Layout */
    .col-status {
      text-align: center;
      min-width: 50px;
    }

    .status-code {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
    }

    .col-status.ok .status-code {
      color: var(--green);
    }

    .col-status.err .status-code {
      color: var(--red);
    }

    .col-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .row-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .req-method {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--accent-glow);
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .req-path {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .req-model {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .req-time {
      font-size: 12px;
      color: var(--text-dim);
    }

    .col-meta {
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .req-duration {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-main);
      font-weight: 500;
    }

    .empty-state {
      padding: 64px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .empty-state .icon {
      font-size: 48px;
      opacity: 0.3;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 400px;
      line-height: 1.5;
    }

    /* ---------------- Modal (彈窗) ---------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-dialog {
      background: var(--bg-page);
      width: 90%;
      max-width: 1100px;
      height: 88vh;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-modal);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px) scale(0.98);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-dialog {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Modal Header */
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-title-row .req-path {
      font-size: 18px;
      color: var(--text-main);
    }

    .modal-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .modal-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-meta-item strong {
      color: var(--text-main);
      font-weight: 500;
      font-family: var(--font-mono);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
      margin-left: 16px;
    }

    .close-btn:hover {
      color: var(--text-main);
      background: var(--bg-surface-hover);
    }

    /* Modal Body */
    .modal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tabs in Modal */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      padding: 0 16px;
      overflow-x: auto;
    }

    .tab {
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text-main);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Tab Content */
    .tab-content {
      flex: 1;
      overflow: auto;
      background: var(--bg-page);
      padding: 0;
      position: relative;
    }

    .code-view {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 24px;
      color: #e4e4e7;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
    }

    /* JSON Syntax Highlighting */
    .json-key {
      color: #8ba4f9;
    }

    .json-string {
      color: #a4d275;
    }

    .json-number {
      color: #e99c6a;
    }

    .json-boolean {
      color: #f17c80;
    }

    .json-null {
      color: var(--text-muted);
      font-style: italic;
    }

    .json-bracket {
      color: #a1a1aa;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }
  </style>
</head>

<body>

  <div class="header">
    <h1><span class="ghost">👻</span> Kiro Gateway — Debug Dashboard</h1>
    <div class="header-actions">
      <span class="badge live" id="sseStatus">Connecting...</span>
      <button class="btn btn-danger" onclick="clearHistory()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        Clear History
      </button>
    </div>
  </div>

  <div class="container">
    <div class="list-header">
      <div class="list-title">Recent API Requests <span id="requestCount">0</span></div>
      <button class="btn" onclick="refreshHistory()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-8.31l5.67-5.67" />
        </svg>
        Refresh
      </button>
    </div>

    <div class="request-list" id="requestList">
      <!-- Rendered via JS -->
    </div>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" onclick="handleBackdropClick(event)">
    <div class="modal-dialog">
      <div class="modal-header" id="modalHeader">
        <!-- Rendered via JS -->
      </div>
      <div class="modal-body">
        <div class="tabs" id="tabBar">
          <!-- Rendered via JS -->
        </div>
        <div class="tab-content" id="tabContent"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/debug/api';
    let records = [];
    let activeRecordData = null;

    // --- Utilities ---
    function formatTime(ts) {
      const d = new Date(ts * 1000);
      const pad = (n) => n.toString().padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${d.getMilliseconds().toString().padStart(3, '0')}`;
    }

    function syntaxHighlight(json) {
      if (typeof json !== 'string') json = JSON.stringify(json, null, 2);
      return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
          let cls = 'json-number';
          if (/^"/.test(match)) {
            if (/:$/.test(match)) {
              cls = 'json-key';
              return '<span class="' + cls + '">' + match.slice(0, -1) + '</span><span class="json-bracket">:</span>';
            } else {
              cls = 'json-string';
            }
          } else if (/true|false/.test(match)) {
            cls = 'json-boolean';
          } else if (/null/.test(match)) {
            cls = 'json-null';
          }
          return '<span class="' + cls + '">' + match + '</span>';
        }).replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // --- List View Rendering ---
    function renderList() {
      const list = document.getElementById('requestList');
      document.getElementById('requestCount').textContent = records.length;

      if (records.length === 0) {
        list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📡</div>
        <h3>Waiting for Requests</h3>
        <p>Send an API request to <code>/v1/chat/completions</code> or <code>/v1/messages</code> through the gateway to see it appear here in real-time.</p>
      </div>`;
        return;
      }

      list.innerHTML = records.map(r => {
        const isErr = r.has_error || r.status_code >= 400;
        const borderClass = isErr ? 'error' : 'success';
        const statusClass = isErr ? 'err' : 'ok';

        return `
      <div class="request-card ${borderClass}" onclick="openModal('${r.id}')">
        <div class="col-status ${statusClass}">
          <div class="status-code">${r.status_code || '—'}</div>
        </div>
        <div class="col-main">
          <div class="row-top">
            <span class="req-method">${r.method || 'POST'}</span>
            <span class="req-path" title="${r.endpoint}">${r.endpoint}</span>
          </div>
          <div class="row-bottom">
            ${r.model_name ? `<span class="req-model">${r.model_name}</span>` : ''}
            <span class="req-time">${formatTime(r.timestamp)}</span>
          </div>
        </div>
        <div class="col-meta">
          <span class="req-duration">${r.duration_ms ? r.duration_ms + ' ms' : '—'}</span>
        </div>
      </div>
    `;
      }).join('');
    }

    // --- Modal Logic ---
    async function openModal(id) {
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden'; // prevent bg body scrolling

      document.getElementById('modalHeader').innerHTML = '<div style="color:var(--text-dim)">Loading request details...</div>';
      document.getElementById('tabBar').innerHTML = '';
      document.getElementById('tabContent').innerHTML = '';

      try {
        const resp = await fetch(`${API_BASE}/history/${id}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        renderModalContent(data);
      } catch (e) {
        document.getElementById('modalHeader').innerHTML = `
      <div style="color:var(--red); font-size:16px;">Failed to load details: ${e.message}</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    `;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
      activeRecordData = null;
    }

    function handleBackdropClick(event) {
      if (event.target === document.getElementById('modalOverlay')) {
        closeModal();
      }
    }

    // Support ESC key to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('open')) {
        closeModal();
      }
    });

    function renderModalContent(data) {
      activeRecordData = data;
      const isErr = data.error_info || data.status_code >= 400;

      // Header
      document.getElementById('modalHeader').innerHTML = `
    <div class="modal-header-info">
      <div class="modal-title-row">
        <span class="req-method">${data.method || 'POST'}</span>
        <span class="req-path">${data.endpoint}</span>
        ${data.model_name ? `<span class="req-model">${data.model_name}</span>` : ''}
      </div>
      <div class="modal-meta-row">
        <div class="modal-meta-item">Status: <strong style="color:var(--${isErr ? 'red' : 'green'})">${data.status_code || 'N/A'}</strong></div>
        <div class="modal-meta-item">Duration: <strong>${data.duration_ms ? data.duration_ms + 'ms' : '—'}</strong></div>
        <div class="modal-meta-item">Time: <strong>${formatTime(data.timestamp)}</strong></div>
        <div class="modal-meta-item">ID: <strong style="color:var(--text-dim)">${data.id}</strong></div>
      </div>
    </div>
    <button class="close-btn" onclick="closeModal()">×</button>
  `;

      // Tabs Definition
      const tabs = [
        { id: 'client', label: 'Client Request', content: data.client_request_body },
        { id: 'kiro', label: 'Gateway Request', content: data.kiro_request_body },
        { id: 'raw', label: 'Response (Raw)', content: data.response_raw },
        { id: 'modified', label: 'Response (Modified)', content: data.response_modified },
        { id: 'logs', label: 'Internal Logs', content: data.app_logs },
      ];
      if (data.error_info) {
        tabs.push({ id: 'error', label: 'Error Trace', content: JSON.stringify(data.error_info, null, 2) });
      }

      // Store data globally for tab switching
      window._modalTabsData = tabs.reduce((acc, tab) => { acc[tab.id] = tab.content; return acc; }, {});

      // Render Tab Bar
      document.getElementById('tabBar').innerHTML = tabs.map((t, i) =>
        `<button class="tab${i === 0 ? ' active' : ''}" id="tab-btn-${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`
      ).join('');

      // Default select first tab
      switchTab(tabs[0].id);
    }

    function switchTab(tabId) {
      const content = window._modalTabsData?.[tabId] || '';

      // Update Active Class
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-btn-${tabId}`).classList.add('active');

      const container = document.getElementById('tabContent');

      if (!content || !content.trim()) {
        container.innerHTML = `<div class="detail-empty">No data recorded for this section.</div>`;
        return;
      }

      if (tabId === 'logs') {
        container.innerHTML = `<pre class="code-view">${escapeHtml(content)}</pre>`;
      } else {
        try {
          const parsed = JSON.parse(content);
          container.innerHTML = `<pre class="code-view">${syntaxHighlight(JSON.stringify(parsed, null, 2))}</pre>`;
        } catch {
          container.innerHTML = `<pre class="code-view">${escapeHtml(content)}</pre>`;
        }
      }
    }

    // --- API Calls & SSE ---
    async function refreshHistory() {
      try {
        const resp = await fetch(`${API_BASE}/history`);
        records = await resp.json();
        renderList();
      } catch (e) {
        console.error('Failed to fetch history:', e);
      }
    }

    async function clearHistory() {
      if (!confirm("Are you sure you want to clear all recorded requests?")) return;
      try {
        await fetch(`${API_BASE}/history`, { method: 'DELETE' });
        records = [];
        renderList();
      } catch (e) {
        console.error('Failed to clear history:', e);
      }
    }

    function connectSSE() {
      const badge = document.getElementById('sseStatus');
      const badgeEl = badge.parentElement;
      const es = new EventSource(`${API_BASE}/stream`);

      es.onopen = () => {
        badge.textContent = 'Live tracking';
        badgeEl.classList.add('live');
        badgeEl.style.color = 'var(--green)';
        badgeEl.style.borderColor = 'rgba(34, 197, 94, 0.2)';
        badgeEl.style.background = 'var(--green-bg)';
      };
      es.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'connected') return;

          // Upsert record
          const existing = records.findIndex(r => r.id === data.id);
          if (existing >= 0) records.splice(existing, 1);
          records.unshift(data);
          renderList();
        } catch (e) {
          console.error('SSE parse error:', e);
        }
      };
      es.onerror = () => {
        badge.textContent = 'Reconnecting...';
        badgeEl.classList.remove('live');
        badgeEl.style.color = 'var(--yellow)';
        badgeEl.style.borderColor = 'rgba(234, 179, 8, 0.2)';
        badgeEl.style.background = 'rgba(234, 179, 8, 0.1)';
        es.close();
        setTimeout(connectSSE, 3000);
      };
    }

    // --- Init ---
    refreshHistory();
    connectSSE();
  </script>
</body>

</html>
